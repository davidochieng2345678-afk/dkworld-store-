<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Redirecting...</title>
    <script>
        (function() {
            // Map of old broken URLs to new correct URLs
            const redirects = {
                '/blog/voice-search/index.html': '/blog/voice-search/',
                '/blog/local-seo-strategies-mombasa-smes.html': '/blog/local-seo-strategies-mombasa-smes/',
                '/blog/from-invisible-to-unstoppable.html': '/blog/from-invisible-to-unstoppable/',
                '/blog/measuring-seo-success-metrics-kenyan-businesses.html': '/blog/measuring-seo-success-metrics-kenyan-businesses/',
                '/blog/shopify-seo-kenya-no-sales-fix.html': '/blog/shopify-seo-kenya-no-sales-fix/'
            };

            const currentPath = window.location.pathname;
            if (redirects[currentPath]) {
                window.location.replace(redirects[currentPath]);
            }
        })();
    </script>
</head>
<body>
    <h1>404 - Page Not Found</h1>
    <p>We're sorry, the page you were looking for has moved. Redirecting you now...</p>
    <p>If you are not redirected, <a href="/">click here to go to the homepage</a>.</p>
</body>
</html>
